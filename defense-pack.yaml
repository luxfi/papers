# Defense Pack manifest — reproducible from git state.
#
# Each entry maps a flat output filename to its source repository + relative
# path. The build script (tools/build-defense-pack.sh) reads this file,
# validates every source PDF exists and is a real PDF, copies them into a
# staging directory, and emits a single .tar.gz with a sha256 sum.
#
# Repos:
#   luxfi/papers   → this repo (~/work/lux/papers)
#   hanzoai/papers → sibling repo. Override location with HANZO_PAPERS_DIR.
#                    Default: ../../hanzo/papers relative to the luxfi/papers
#                    repo root.
#
# UNRESOLVED entries have no source file in either tracked repo. The build
# script fails fast on UNRESOLVED unless ALLOW_UNRESOLVED=1.

release: defense-pack-2026-05-12
