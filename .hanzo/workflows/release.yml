name: Release

# Builds the reproducible Defense Pack from luxfi/papers + hanzoai/papers per
# the manifest at defense-pack.yaml, on the native runners
# (git.hanzo.ai → git-runner).
#
# A `defense-pack-*` tag cuts a Release; a manual dispatch uploads workflow
# artifacts only.
#
# This replaces .github/workflows/defense-pack.yml, which named
# `runs-on: lux-build-amd64`. No runner on this forge carries that label — the
# pools are `lux-build-linux-<arch>` — and a job naming a label nothing carries
# does not fail, it waits.
#
# hanzoai/papers is still fetched with actions/checkout + `repository:`, which
# resolves against GITHUB_SERVER_URL. That is deliberate: it is a fleet repo, so
# it resolves on whichever forge is running the job.

on:
  push:
    tags: ['defense-pack-*']
  workflow_dispatch:
    inputs:
      hanzo_ref:
        description: 'hanzoai/papers ref to build against'
        required: false
        default: 'main'

permissions:
  contents: write  # gh release create / upload

# A release is not made irrelevant by a newer one — let it finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Defense Pack
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 45
    steps:
      - name: Checkout luxfi/papers
        uses: actions/checkout@v4
        with:
          path: luxfi-papers
          fetch-depth: 1

      - name: Checkout hanzoai/papers
        uses: actions/checkout@v4
        with:
          repository: hanzoai/papers
          ref: ${{ github.event.inputs.hanzo_ref || 'main' }}
          path: hanzoai-papers
          fetch-depth: 1

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils python3-yaml coreutils tar gzip
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build pack
        env:
          HANZO_PAPERS_DIR: ${{ github.workspace }}/hanzoai-papers
          OUT_DIR: ${{ github.workspace }}/dist
          # UNRESOLVED entries are skipped rather than fatal — a tagged release
          # that needs a missing paper should resolve it in the manifest first.
          ALLOW_UNRESOLVED: '1'
        run: |
          cd luxfi-papers
          bash tools/build-defense-pack.sh

      - name: Show outputs
        run: |
          ls -la dist/
          cat dist/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: defense-pack
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.txt
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/defense-pack-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          cd "${GITHUB_WORKSPACE}/dist"
          # Create the release if missing, then upload with --clobber so
          # re-running the tag is idempotent.
          if ! gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              gh release create "$tag" \
                -R "${{ github.repository }}" \
                --title "Defense Pack ${tag#defense-pack-}" \
                --notes "Reproducible build from defense-pack.yaml manifest. See *.sha256 for archive digest and *.manifest.txt for per-file digests."
          fi
          gh release upload "$tag" \
            -R "${{ github.repository }}" \
            --clobber \
            *.tar.gz *.sha256 *.manifest.txt
