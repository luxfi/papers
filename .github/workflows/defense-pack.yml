name: Defense Pack

# Builds the reproducible Defense Pack from luxfi/papers + hanzoai/papers
# given the manifest at defense-pack.yaml. Triggered by:
#   * pushing a tag matching defense-pack-* (cuts a Release)
#   * manual dispatch (uploads workflow artifacts only)
#
# Both repos are public, so the default GITHUB_TOKEN can clone hanzoai/papers
# without extra secrets.

on:
  push:
    tags: ['defense-pack-*']
  workflow_dispatch:
    inputs:
      hanzo_ref:
        description: 'hanzoai/papers ref to build against'
        required: false
        default: 'main'

permissions:
  contents: write  # required for gh release upload

jobs:
  build:
    name: Build Defense Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout luxfi/papers
        uses: actions/checkout@v4
        with:
          path: luxfi-papers
          fetch-depth: 1

      - name: Checkout hanzoai/papers
        uses: actions/checkout@v4
        with:
          repository: hanzoai/papers
          ref: ${{ github.event.inputs.hanzo_ref || 'main' }}
          path: hanzoai-papers
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils python3-yaml coreutils tar gzip
          # mikefarah yq for fastest parse
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build pack
        env:
          HANZO_PAPERS_DIR: ${{ github.workspace }}/hanzoai-papers
          OUT_DIR: ${{ github.workspace }}/dist
          # Allow UNRESOLVED entries to be skipped — a tagged release that
          # needs a missing paper should resolve it in the manifest first.
          ALLOW_UNRESOLVED: '1'
        run: |
          cd luxfi-papers
          bash tools/build-defense-pack.sh

      - name: Show outputs
        run: |
          ls -la dist/
          cat dist/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: defense-pack
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.txt
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/defense-pack-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cd "${GITHUB_WORKSPACE}/dist"
          # Create release if missing, then upload (clobber to keep tag idempotent).
          if ! gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              gh release create "$tag" \
                -R "${{ github.repository }}" \
                --title "Defense Pack ${tag#defense-pack-}" \
                --notes "Reproducible build from defense-pack.yaml manifest. See *.sha256 for archive digest and *.manifest.txt for per-file digests."
          fi
          gh release upload "$tag" \
            -R "${{ github.repository }}" \
            --clobber \
            *.tar.gz *.sha256 *.manifest.txt
