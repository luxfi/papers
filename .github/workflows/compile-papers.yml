name: Compile LaTeX Papers to PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.tex'
      - '**.bib'
      - 'Makefile'
      - '.github/workflows/compile-papers.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Compile all LaTeX papers
        run: |
          set -e
          mkdir -p pdfs pdfs/fhe pdfs/proofs

          # Root papers
          for texfile in *.tex; do
            [ "$texfile" = "cover-lux.tex" ] && continue
            [ ! -f "$texfile" ] && continue
            basename="${texfile%.tex}"
            echo "Compiling $texfile..."
            pdflatex -interaction=nonstopmode "$texfile" || true
            bibtex "$basename" 2>/dev/null || true
            pdflatex -interaction=nonstopmode "$texfile" || true
            pdflatex -interaction=nonstopmode "$texfile" || true
            [ -f "${basename}.pdf" ] && cp "${basename}.pdf" pdfs/ && echo "  OK ${basename}.pdf" || echo "  FAIL ${basename}.pdf"
            rm -f *.aux *.log *.bbl *.blg *.out *.toc *.lof *.lot
          done

          # FHE papers
          for d in fhe/*/; do
            [ -f "$d/main.tex" ] || continue
            name=$(basename "$d")
            echo "Compiling fhe/$name..."
            (cd "$d" && pdflatex -interaction=nonstopmode main.tex || true && bibtex main 2>/dev/null || true && pdflatex -interaction=nonstopmode main.tex || true && pdflatex -interaction=nonstopmode main.tex || true)
            [ -f "$d/main.pdf" ] && cp "$d/main.pdf" "pdfs/fhe/luxfhe-${name}.pdf" && echo "  OK luxfhe-${name}.pdf" || echo "  FAIL fhe/$name"
          done

          # Proof papers
          for texfile in proofs/*.tex; do
            [ ! -f "$texfile" ] && continue
            basename=$(basename "${texfile%.tex}")
            echo "Compiling proofs/$basename..."
            (cd proofs && pdflatex -interaction=nonstopmode "$basename.tex" || true && pdflatex -interaction=nonstopmode "$basename.tex" || true)
            [ -f "proofs/${basename}.pdf" ] && cp "proofs/${basename}.pdf" pdfs/proofs/ && echo "  OK proofs/${basename}.pdf" || echo "  FAIL proofs/${basename}.pdf"
            rm -f proofs/*.aux proofs/*.log proofs/*.out
          done

          echo ""
          echo "=== Build Summary ==="
          find pdfs -name "*.pdf" | wc -l
          echo "PDFs generated"

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-papers
          path: |
            pdfs/*.pdf
            pdfs/fhe/*.pdf
            pdfs/proofs/*.pdf
          retention-days: 90

      - name: Create release with PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Lux Papers Build #${{ github.run_number }}"
          files: |
            pdfs/*.pdf
            pdfs/fhe/*.pdf
            pdfs/proofs/*.pdf
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit PDFs back to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add pdfs/*.pdf pdfs/fhe/*.pdf pdfs/proofs/*.pdf 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generated PDFs from LaTeX sources [skip ci]"
            git push
          fi
